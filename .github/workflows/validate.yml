name: Validate Robot Project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate project structure
        run: python tools/validate_project.py
      - name: Syntax-check controller scaffold
        run: g++ -std=c++17 -fsyntax-only firmware/arm_controller/main.cpp
